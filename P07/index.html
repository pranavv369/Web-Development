<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Tokens</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Design System</h1>
        <p>CSS Design Tokens and Typography</p>
    </header>

    <main>
        <section>
            <h1>Heading One</h1>
            <h2>Heading Two</h2>
            <h3>Heading Three</h3>
            <p>This is a sample paragraph demonstrating the typography system.</p>
            <small>This is small text.</small>
        </section>

        <section>
            <h2>Color Palette</h2>
            <div class="color-box primary">Primary Color</div>
            <div class="color-box secondary">Secondary Color</div>
            <div class="color-box accent">Accent Color</div>
        </section>

        <section>
            <h2>Buttons</h2>
            <button class="primary-btn">Primary Button</button>
            <button class="secondary-btn">Secondary Button</button>
        </section>
    </main>

</body>
</html>
